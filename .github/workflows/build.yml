name: Build Boards

on:
  workflow_dispatch:
   inputs:
      board:
        description: 'board'
        required: true
        default: 'bread-compact-wifi-lcd'
        type: choice
        options:
          - bread-compact-wifi-lcd
      name:
        description: 'name'
        required: true
        default: 'bread-compact-wifi-lcd'
        type: choice
        options:
          - bread-compact-wifi-lcd
  #push:
    #branches:
    #  - main
    #  - ci/* # for ci test
  #pull_request:
  #  branches:
  #    - main

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ inputs.name }}
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build current variant
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          python scripts/release.py ${{ inputs.board }} --name ${{ inputs.name }}
          echo "DATE=$(date +"%Y-%m-%d %H:%M:%S")" >> $GITHUB_ENV
          echo "TAG_DATE=$(date +"%Y.%m.%d-%H.%M")" >> $GITHUB_ENV
          VER=$(grep -oP 'set\(PROJECT_VER\s+"\K[^"]+' CMakeLists.txt)
          echo "VER=$VER" >> $GITHUB_ENV
      
      - name: 上传发布固件
        uses: ncipollo/release-action@v1.20.0
        with:
          name: R${{ env.DATE }}
          commit: ${{ github.sha }}
          tag: R${{env.VER}}_${{ env.TAG_DATE }}
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: releases/*
          body: |
            ### 🧊 固件版本
            - v${{env.VER}}
            - R${{ env.DATE }}
            - ${{ github.sha }}
